services:
  redis-database:
    container_name: redis-database
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data
    
  postgres-database:
    container_name: postgres-database
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: lateralus_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-test-database:
    profiles: ["test"]
    image: redis:latest
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 10

  postgres-test-database:
    profiles: ["test"]
    image: postgres:latest
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: lateralus_test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d lateralus_test_db"]
      interval: 2s
      timeout: 2s
      retries: 10


volumes:
  redis-data:
  postgres-data:
